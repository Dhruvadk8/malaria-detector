<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Malaria Detection System</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome-fallback.css') }}">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
                <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" class="auth-logo">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join us to start detecting malaria</p>
      </div>

            <form class="auth-form" id="signupForm" method="POST">
        <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-input" required>
        </div>

        <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" required>
        </div>

        <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required
                           minlength="8"
                           title="Password must be at least 8 characters and include both letters and numbers">
                    <i class="password-toggle fas fa-eye" onclick="togglePassword('password')"></i>
                    <div class="password-strength">
                        <div class="strength-meter">
                            <div id="strength-bar"></div>
          </div>
                        <small id="strength-text" class="text-muted"></small>
                        <small class="password-requirements text-muted">
                            Password requirements:
                            <ul>
                                <li id="length-req">❌ At least 8 characters</li>
                                <li id="letter-req">❌ At least one letter</li>
                                <li id="number-req">❌ At least one number</li>
                            </ul>
                        </small>
          </div>
        </div>

        <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" required>
                    <i class="password-toggle fas fa-eye" onclick="togglePassword('confirm_password')"></i>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a></label>
          </div>
        </div>

                <button type="submit" class="auth-button" id="signupButton">
                    Create Account
        </button>

                <div class="social-divider">or</div>

                <div class="social-login">
                    <button type="button" class="social-button" onclick="signInWithGoogle()">
                        <img src="https://www.google.com/favicon.ico" alt="Google">
                        <span>Sign up with Google</span>
                    </button>
        </div>
      </form>

            <div class="auth-footer">
                Already have an account? <a href="{{ url_for('main.login_page') }}">Sign in</a>
            </div>
    </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
    
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDp7O_ymfpavylfIeNXO9wUwCi8xi9HGEI",
            authDomain: "malaria-detection-71269.firebaseapp.com",
            projectId: "malaria-detection-71269",
            storageBucket: "malaria-detection-71269.firebasestorage.app",
            messagingSenderId: "588111581098",
            appId: "1:588111581098:web:5f9aa15f1e2d5e325c65d3",
            measurementId: "G-KG7N8E3BB7"
        };
        try {
            firebase.initializeApp(firebaseConfig);
        } catch (err) {
            console.warn('Firebase init skipped:', err);
        }

        // Toggle password visibility
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const icon = passwordInput.nextElementSibling;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
      }
    }

    // Password strength checker
    function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');
            const lengthReq = document.getElementById('length-req');
            const letterReq = document.getElementById('letter-req');
            const numberReq = document.getElementById('number-req');

            // Check requirements
            const isLongEnough = password.length >= 8;
            const hasLetter = /[A-Za-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);

            // Update requirement indicators
            lengthReq.innerHTML = (isLongEnough ? '✅' : '❌') + ' At least 8 characters';
            letterReq.innerHTML = (hasLetter ? '✅' : '❌') + ' At least one letter';
            numberReq.innerHTML = (hasNumber ? '✅' : '❌') + ' At least one number';

            // Calculate strength
      let strength = 0;
            if (isLongEnough) strength++;
            if (hasLetter) strength++;
            if (hasNumber) strength++;

            // Update strength bar
            switch (strength) {
                case 0:
                    strengthBar.style.width = '0%';
                    strengthBar.style.backgroundColor = 'var(--danger-color)';
                    strengthText.textContent = 'Too Weak';
                    strengthText.style.color = 'var(--danger-color)';
                    break;
                case 1:
                    strengthBar.style.width = '33%';
                    strengthBar.style.backgroundColor = 'var(--danger-color)';
                    strengthText.textContent = 'Weak';
                    strengthText.style.color = 'var(--danger-color)';
                    break;
                case 2:
                    strengthBar.style.width = '66%';
                    strengthBar.style.backgroundColor = 'var(--warning-color)';
                    strengthText.textContent = 'Almost There';
                    strengthText.style.color = 'var(--warning-color)';
                    break;
                case 3:
                    strengthBar.style.width = '100%';
                    strengthBar.style.backgroundColor = 'var(--success-color)';
                    strengthText.textContent = 'Strong';
                    strengthText.style.color = 'var(--success-color)';
                    break;
            }
        }

        document.getElementById('password').addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
        });

        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = document.getElementById('signupButton');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            // Password validation
            const hasLetter = /[a-zA-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const isLongEnough = password.length >= 8;

            if (!hasLetter || !hasNumber || !isLongEnough) {
                Swal.fire({
                    icon: 'error',
                    title: 'Invalid Password',
                    html: 'Password must:<br>' +
                          '- Be at least 8 characters long<br>' +
                          '- Include at least one letter<br>' +
                          '- Include at least one number',
                    confirmButtonColor: '#2563eb'
                });
                return;
      }

      if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Passwords Do Not Match',
                    text: 'Please make sure both passwords are the same',
                    confirmButtonColor: '#2563eb'
                });
        return;
      }

            button.disabled = true;
            button.classList.add('loading');

      try {
                const formData = new FormData(e.target);
                const payload = {
                    username: formData.get('username'),
                    email: formData.get('email'),
                    password: formData.get('password')
                };
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Signup failed');
                }

                const loginResponse = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        email: payload.email,
                        password: payload.password
                    })
                });

                if (!loginResponse.ok) {
                    window.location.href = '{{ url_for("main.login_page") }}';
                    return;
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Account created',
                    text: 'Opening your dashboard...',
                    showConfirmButton: false,
                    timer: 1200
                }).then(() => {
                    window.location.href = '{{ url_for("main.dashboard") }}';
                });
      } catch (error) {
        console.error('Signup error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.message || 'An unexpected error occurred',
                    confirmButtonColor: '#2563eb'
                });
      } finally {
                button.disabled = false;
                button.classList.remove('loading');
            }
        });

    // Google Sign In
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    // Get the ID token
                    return result.user.getIdToken().then(idToken => {
                        // Send the ID token to the backend
                        return fetch('/api/google-login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                token: idToken
                            })
                        });
                    });
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '{{ url_for("main.login_page") }}';
                    } else {
                        throw new Error(data.error || 'Google sign-in failed');
                    }
                })
                .catch((error) => {
                    console.error('Google Sign In Error:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Authentication Failed',
                        text: error.message || 'Failed to sign in with Google. Please try again.',
                        confirmButtonColor: '#2563eb'
                    });
                });
        }
  </script>
</body>
</html>
